appId: com.vibesync.app
productName: VibeSync
copyright: Copyright © 2026 VibeSync
executableName: VibeSync
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: helper/bin
    to: helper
    filter:
      - "**/*.exe"
      - "**/*.dll"
      - "**/*.config"
      - "**/*.txt"
  - from: linux-helper
    to: linux-helper
    filter:
      - "**/*.cjs"
  # Installed into Spicetify by Settings › Spotify › Install bridge.
  - from: spicetify
    to: spicetify
    filter:
      - "*.js"
asar: true
npmRebuild: false
nodeGypRebuild: false
compression: normal
# Update feed: the app reads resources/app-update.yml and checks GitHub Releases.
# Builds never upload; attach latest.yml / latest-linux.yml and the .blockmap files to the release.
publish:
  provider: github
  owner: shadythewolf
  repo: VibeSync
electronDownload:
  cache: .electron-cache
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # The custom uninstall window; installer/installer.nsh opens it from the NSIS uninstaller.
  extraResources:
    - from: installer/setup/bin
      to: uninstaller
      filter:
        - Uninstall.exe
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # true, not always: updates then leave a deleted (or never created) desktop shortcut alone.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VibeSync
  menuCategory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: VibeSync
  # The package the custom setup wraps (installer/setup) and that the updater downloads;
  # people download VibeSync-Setup-<version>.exe instead.
  artifactName: ${productName}-Package-${version}.${ext}
  include: installer/installer.nsh
  displayLanguageSelector: false
portable:
  artifactName: ${productName}-Portable.${ext}
  requestExecutionLevel: user
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  artifactName: ${productName}-Linux-${version}.${ext}
  # Required for the .deb; a GitHub no-reply address keeps a real email out of the package.
  maintainer: Shady <shadythewolf@users.noreply.github.com>
  # Lets desktops match the running window to vibesync.desktop (dock icon, grouping).
  syncDesktopName: true
# The .deb installs a menu entry and pulls in pactl/parec, so no chmod, FUSE or manual packages.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - pulseaudio-utils
